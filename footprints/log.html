<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EFE6DA">
<title>旅の記録 — オーストラリア 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* ============ 旅の記録 — 紙と雲 ============
 * 扉（七日の一覧）と、日ごとの記録。スクロールで時間帯の光が変わり、写真がゆっくり寄ってくる。 */
:root{
  --paper:#EFE6DA; --cloud:#F6EFE5; --cloud2:#F7E3D6; --ink:#3A3532; --dim:#9A8E84; --mid:#5E554E; --acc:#D8907A; --line:rgba(58,53,50,.16);
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif; --serif:"Shippori Mincho","Hiragino Mincho ProN",serif; --en:"Inter Tight",var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background 1.6s ease;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky svg{position:absolute;left:-10%;top:0;width:120%;height:100%}
#sky .c1{fill:var(--cloud);transition:fill 1.6s}
#sky .c2{fill:var(--cloud2);opacity:.9;transition:fill 1.6s}
@media (prefers-reduced-motion:no-preference){
  #sky .drift{animation:drift 90s ease-in-out infinite alternate}
  #sky .drift.slow{animation-duration:140s;animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-6%)}}
}
#prog{position:fixed;left:0;top:0;height:2px;width:0;background:var(--acc);z-index:30;transition:width .15s linear}
#totop{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:7px;padding:10px 15px 10px 13px;border-radius:24px;background:var(--ink);color:#fff;font-size:12px;letter-spacing:.1em;text-decoration:none;box-shadow:0 12px 26px -12px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s}
#totop.on{opacity:1;transform:none;pointer-events:auto}
#totop i{display:block;width:7px;height:7px;border-left:1.5px solid #fff;border-top:1.5px solid #fff;transform:rotate(45deg) translateY(2px)}
header{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(180deg,var(--paper) 70%,transparent);transition:background 1.6s}
.wm{font-family:var(--en);font-weight:300;font-size:10.5px;letter-spacing:.2em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-decoration:none}
#now{font-family:var(--en);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center;opacity:0;transition:opacity .4s}
#now.on{opacity:1}
header:has(#now.on) .wm{display:none}
#now{text-align:left}
#days{display:flex;gap:1px;font-family:var(--en);font-size:11px;color:var(--dim);flex:none}
#days a{padding:2px 5px;border-radius:12px;letter-spacing:.02em;transition:background .3s,color .3s;text-decoration:none}
#days a.on{color:var(--ink);background:rgba(255,255,255,.85)}
main{position:relative;z-index:10;max-width:560px;margin:0 auto;padding:18px 22px calc(60px + env(safe-area-inset-bottom))}
/* 扉 */
.cover{padding:30px 0 10px}
.cover small{display:block;font-family:var(--en);font-weight:300;font-size:12px;letter-spacing:.3em;color:var(--dim)}
.cover .ttl{font-family:var(--en);font-weight:300;font-size:46px;line-height:1;letter-spacing:-.03em;margin-top:10px}
.cover .ttl b{font-weight:500}
.cover h1{font-weight:500;font-size:17px;letter-spacing:.06em;margin-top:12px}
.cover .lead{font-family:var(--serif);font-size:12.5px;line-height:1.9;letter-spacing:.06em;color:var(--mid);margin-top:8px}
/* 旅の地図：全写真のピン */
.tmap{position:relative;margin:22px 0 0;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.42);box-shadow:0 20px 40px -30px rgba(90,70,50,.5)}
#pinmap{height:300px;background:#F4F1EC}
#pinmap .leaflet-tile-pane{filter:grayscale(.9) saturate(.5) brightness(1.06) contrast(.88)}
#pinmap .leaflet-control-attribution{font-size:8.5px;background:rgba(255,255,255,.6)}
.pin{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink));opacity:.8;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:opacity .4s,transform .4s}
.pin.dim{opacity:.12;transform:scale(.7)}
.tmap .cap .dz{display:flex;gap:4px;flex-wrap:wrap}
.tmap .cap .dz button{font-family:var(--en);font-size:10.5px;letter-spacing:.06em;color:var(--mid);padding:3px 0;width:34px;border-radius:12px;background:rgba(255,255,255,.7);position:relative}
.tmap .cap .dz button::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:1px}
.tmap .cap .dz button.on{background:var(--ink);color:#fff}
.pin.big{width:11px;height:11px;background:var(--acc);opacity:.95;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tmap .cap{display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;font-family:var(--en);font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
.tmap .cap .z{display:flex;gap:4px;flex-wrap:wrap}
.tmap .cap .z button{font-family:var(--sans);font-size:11px;letter-spacing:.02em;color:var(--mid);padding:4px 11px;border-radius:12px;background:rgba(255,255,255,.7);white-space:nowrap}
.tmap .cap .z button.on{color:#fff;background:var(--ink)}
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 10px 30px rgba(90,70,50,.25)}
.leaflet-popup-content{margin:8px 10px;font-size:12px}
.leaflet-popup-content a{font-family:var(--en);font-size:10px;letter-spacing:.16em;color:var(--dim);text-decoration:none;display:block;margin-top:2px}
.fpbig{display:block;position:relative;margin:22px 0 0;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--ink);text-decoration:none;color:#fff;
  box-shadow:0 40px 60px -32px rgba(90,70,50,.55),0 10px 24px rgba(90,70,50,.14)}
.fpbig img{position:absolute;inset:-8% 0;width:100%;height:116%;object-fit:cover;display:block;opacity:0;transition:opacity .8s;will-change:transform}
.fpbig img.ld{opacity:1}
.fpbig::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,25,20,.1),rgba(30,25,20,.05) 35%,rgba(30,25,20,.7))}
.fpbig .tx{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.fpbig .tx small{display:block;font-family:var(--en);font-weight:400;font-size:11px;letter-spacing:.3em;opacity:.9}
.fpbig .tx b{display:block;font-weight:500;font-size:30px;line-height:1.1;letter-spacing:.02em;margin-top:6px;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.fpbig .tx span{display:block;font-family:var(--serif);font-size:12.5px;letter-spacing:.08em;margin-top:8px;opacity:.9}
.fpbig .tx i{position:absolute;right:0;bottom:2px;font-style:normal;font-family:var(--en);font-weight:300;font-size:26px}
.toc{margin:26px 0 8px;border-top:1px solid var(--line)}
.toc a{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.toc a small{font-family:var(--en);font-size:10px;letter-spacing:.2em;color:var(--dim);white-space:nowrap;min-width:110px}
.toc a span{font-size:13.5px;font-weight:500}
.day{margin-top:56px;padding-top:8px}
.day + .day{border-top:1px solid var(--line);margin-top:64px;padding-top:26px}
.dayc{display:block;position:relative;margin:26px 0 0;border-radius:16px;overflow:hidden;text-decoration:none;aspect-ratio:4/3;background:rgba(255,255,255,.4);
  box-shadow:0 40px 60px -32px rgba(90,70,50,.5),0 10px 24px rgba(90,70,50,.12);transform:translateY(24px) scale(.97);opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s}
.dayc.in{transform:none;opacity:1}
.dayc img{position:absolute;inset:-8% 0;width:100%;height:116%;object-fit:cover;display:block;opacity:0;transition:opacity .8s;will-change:transform}
.dayc img.ld{opacity:1}
.dayc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,25,20,0) 40%,rgba(30,25,20,.62))}
.dayc .tx{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff}
.dayc .tx small{display:block;font-family:var(--en);font-weight:300;font-size:11px;letter-spacing:.26em;opacity:.85}
.dayc .tx b{display:block;font-family:var(--en);font-weight:300;font-size:34px;line-height:1;letter-spacing:-.02em;margin-top:4px}
.dayc .tx span{display:block;font-weight:500;font-size:14.5px;margin-top:8px;letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.dayc.nop{aspect-ratio:auto;padding:22px 18px;background:rgba(255,255,255,.5)}
.dayc.nop::after{display:none}
.dayc.nop .tx{position:static;color:var(--ink)}.dayc.nop .tx small{color:var(--dim)}.dayc.nop .tx span{text-shadow:none}
/* 日ごと */
.head{margin:26px 0 30px;position:relative}
.head.hp{margin:26px -22px 30px;padding:120px 22px 24px;border-radius:0;overflow:hidden;min-height:340px;display:flex;align-items:flex-end;color:#fff}
.head.hp .bg{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;display:block;opacity:0;transition:opacity 1s;will-change:transform}
.head.hp .bg.ld{opacity:1}
.head.hp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,25,20,.15),rgba(30,25,20,.05) 40%,rgba(30,25,20,.72))}
.head.hp .hin{position:relative;z-index:2}
.head.hp small{color:rgba(255,255,255,.85)}
.head.hp .date{color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.head.hp h1{color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.head.hp .lead{color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(0,0,0,.4)}
.head small{display:block;font-family:var(--en);font-weight:300;font-size:12px;letter-spacing:.28em;color:var(--dim)}
.head .date{font-family:var(--en);font-weight:300;font-size:52px;line-height:1;letter-spacing:-.03em;margin-top:8px}
.head .date b{font-weight:500}
.head h1{font-weight:500;font-size:19px;line-height:1.5;letter-spacing:.02em;margin-top:12px;font-feature-settings:"palt";text-wrap:balance}
.sec{margin:38px 0 0}
.sec h2{font-family:var(--en);font-weight:400;font-size:11px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.sec h2 b{display:block;font-family:var(--sans);font-weight:500;font-size:17px;letter-spacing:.02em;color:var(--ink);margin-top:4px;text-transform:none;font-feature-settings:"palt"}
.sec h3{font-weight:500;font-size:14px;margin:18px 0 4px;letter-spacing:.02em}
.p{position:relative;padding:14px 0 6px;font-size:14px;line-height:2;letter-spacing:.02em;font-weight:400;text-align:justify}
.p.li{padding:5px 0 5px 16px;font-size:13.5px;line-height:1.8;color:var(--mid)}
.p.li::before{content:"";position:absolute;left:3px;top:16px;width:4px;height:4px;border-radius:50%;background:var(--dim)}
.head .lead{font-family:var(--serif);font-size:12.5px;line-height:1.9;letter-spacing:.06em;color:var(--mid);margin-top:10px}
.p .t{display:block;font-family:var(--en);font-weight:400;font-size:11px;letter-spacing:.16em;color:var(--acc);margin-bottom:2px}
.p b{font-weight:700}
.p.sub{padding-left:16px;font-size:13.5px;color:var(--mid)}
.p.sub::before{content:"";position:absolute;left:4px;top:26px;width:4px;height:4px;border-radius:50%;background:var(--dim)}
/* 代表写真：段落の下に 1〜2 枚。現れるときに寄ってくる。スクロールで中がわずかに動く */
.hero{display:grid;gap:8px;margin:10px 0 18px}
.hero{align-items:start}
.hero.n2{grid-template-columns:3fr 2fr}
.hero.n2 button:last-child{margin-top:26px}
.hero.n3 button:nth-child(3){margin-top:18px}
.hero.n4 button:nth-child(2){margin-top:22px}
.hero.n4 button:nth-child(3){margin-top:-10px}
.hero.n3{grid-template-columns:1fr 1fr}
.hero.n3 button:first-child{grid-column:1 / -1}
.hero.n4{grid-template-columns:1fr 1fr}
.hero button{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.4);
  box-shadow:0 30px 50px -28px rgba(90,70,50,.5),0 6px 16px rgba(90,70,50,.10);transform:translateY(18px) scale(.97);opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s}
.hero.n2 button:last-child{aspect-ratio:auto}
.hero.n3 button:not(:first-child),.hero.n4 button{aspect-ratio:1}
.hero button.in{transform:none;opacity:1}
.hero button.tall{aspect-ratio:3/4}
.hero button img{position:absolute;left:0;top:-7%;width:100%;height:114%;object-fit:cover;display:block;opacity:0;transition:opacity .6s;will-change:transform}
.hero button img.ld{opacity:1}
.hero button .cap{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;font-family:var(--serif);font-size:11px;letter-spacing:.06em;line-height:1.5;color:#fff;text-align:left;text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .6s .3s}
.hero button.in .cap{opacity:.95}
.hero.n2 button:last-child .cap,.hero.n3 button:not(:first-child) .cap,.hero.n4 button .cap{font-size:10px;letter-spacing:.04em;line-height:1.4}
.more{display:inline-block;margin:0 0 8px;font-family:var(--en);font-weight:400;font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.note{font-family:var(--serif);font-size:12.5px;line-height:1.9;letter-spacing:.06em;color:var(--mid)}
.pager{display:flex;justify-content:space-between;gap:12px;margin:46px 0 0;border-top:1px solid var(--line);padding-top:16px}
.pager a{text-decoration:none;font-size:12.5px;color:var(--mid);line-height:1.6;max-width:48%}
.pager a small{display:block;font-family:var(--en);font-size:10px;letter-spacing:.2em;color:var(--dim)}
.pager a.nx{text-align:right;margin-left:auto}
.fp{display:block;margin:18px 0 8px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.55);text-decoration:none;box-shadow:0 10px 30px -18px rgba(90,70,50,.5)}
.fp small{display:block;font-family:var(--en);font-size:10px;letter-spacing:.26em;color:var(--dim)}
.fp span{display:block;font-weight:500;font-size:16px;margin-top:2px}
.fp em{display:block;font-style:normal;font-family:var(--serif);font-size:12px;color:var(--mid);letter-spacing:.06em;margin-top:2px}
.foot{margin-top:56px;text-align:center;font-family:var(--en);font-size:10px;letter-spacing:.24em;color:var(--dim)}
.foot a{color:var(--dim)}
.foot button{font-family:var(--en);font-size:10px;letter-spacing:.24em;color:var(--dim);border-bottom:1px solid var(--line)}
#lb{position:fixed;inset:0;z-index:60;background:#111;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:82vh;border-radius:4px}
#lb .c{font-family:var(--en);font-size:10.5px;letter-spacing:.2em;color:#CFC7B8}
#veil{position:fixed;inset:0;z-index:30;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .45s}
#veil.on{opacity:1}
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper)}
#lock[hidden]{display:none}
.lk{width:100%;max-width:320px;text-align:center}
.lk .wm{display:block;margin-bottom:12px}
.lk h2{font-weight:500;font-size:28px;letter-spacing:.04em}
.lk p{font-family:var(--serif);font-size:12.5px;letter-spacing:.08em;color:var(--mid);margin-top:8px;line-height:1.8}
.lk input{display:block;width:100%;margin:26px 0 0;font:500 18px var(--en);letter-spacing:.06em;padding:10px 4px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);outline:none;text-align:center;border-radius:0}
.lk button{margin-top:18px;width:100%;padding:13px;border-radius:26px;background:var(--ink);color:#fff;font-weight:500;letter-spacing:.14em}
.lk .msg{min-height:20px;margin-top:10px;font-size:12px;color:var(--acc)}
.lk a{display:inline-block;margin-top:18px;font-family:var(--en);font-size:11px;letter-spacing:.2em;color:var(--dim);text-decoration:none}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;font-family:var(--en);font-size:11px;letter-spacing:.3em;color:var(--dim);background:var(--paper);transition:opacity .5s;pointer-events:none}
#loading.off{opacity:0}
</style>
</head>

Vault.base('../');
/* 日ごとの紙。TONE は時間帯ごとの雲の色（朝→昼→午後→夕方→夜） */
var PAPER = {

  '0923': ['#E6E9EC', '#F0F2F4', '#F5E7DF'], '0924': ['#EFE6DA', '#F6EFE5', '#F7E3D6'], '0925': ['#E4E9EE', '#EFF2F5', '#F3E4DC'], '0926': ['#E9E6E3', '#F3F0EC', '#F1E4DC']
};
var TONE = { morning: ['#F8F3EA', '#F6E6D8'], noon: ['#F9F7F1', '#EEF0EA'], afternoon: ['#F7EFE0', '#F3E2C8'], evening: ['#F3E4E0', '#E9D3D6'], night: ['#DDE0E6', '#CFD3DC'] };
var DAY_NO = { '0920': 1, '0921': 2, '0922': 3, '0923': 4, '0924': 5, '0925': 6, '0926': 7 };
var DAY_TITLE = { '0920': '成田から、夜の便で', '0921': 'メルボルン、路地とアーケード', '0922': '市場、庭園、図書館、劇場', '0923': 'メルボルンからシドニーへ', '0924': 'ブルーマウンテンズ', '0925': 'シドニー最終日', '0926': '帰国' };
var HERO = { '0920': '1539', '0921': '1596', '0922': '1738', '0923': '1860', '0924': '2013', '0925': '2290', '0926': '2371' };
var $ = function (id) { return document.getElementById(id); };
